name: Reorganize source tree

on:
  pull_request:
    branches:
      - feature/receipts
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/src-structure
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reorganize source files
        run: node scripts/reorganize-src.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and server syntax
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Commit organized structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: organize src by feature"
          git push origin HEAD:refactor/src-structure
