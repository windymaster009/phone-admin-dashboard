plugins {
    id "com.android.application"
}

android {
    namespace "com.phoneflow.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "com.phoneflow.mobile"
        minSdk 26
        targetSdk 35
        versionCode 10910
        versionName "1.9.10"

        buildConfigField "String", "DEFAULT_SERVER_URL", '""'
        buildConfigField "boolean", "ALLOW_PRIVATE_LAN_HTTP", "false"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "DEFAULT_SERVER_URL", '"http://127.0.0.1:5173"'
            buildConfigField "boolean", "ALLOW_PRIVATE_LAN_HTTP", "true"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        shop {
            initWith release
            applicationIdSuffix ".debug"
            versionNameSuffix "-shop"
            signingConfig signingConfigs.debug
            debuggable false
            buildConfigField "boolean", "ALLOW_PRIVATE_LAN_HTTP", "true"
            matchingFallbacks = ["release"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.webkit:webkit:1.16.0"

    def cameraxVersion = "1.6.1"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
